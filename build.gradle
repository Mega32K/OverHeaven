buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    configurations.classpath.resolutionStrategy.cacheChangingModulesFor 30, 'days'
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
base { archivesName = mod_id + '-1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(project.providers.gradleProperty('overheavenRunDirectory').getOrElse('run'))
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.blackhole.mixins.json"
    config "${mod_id}.finale.mixins.json"
    config "${mod_id}.illusiontp.mixins.json"
    config "${mod_id}.colorloss.mixins.json"
    config "${mod_id}.worldwarp.mixins.json"
}
repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}
// Pin Modrinth version IDs to the audited Forge releases, rather than a mutable latest version.
def swayDependency = 'maven.modrinth:sway:zZZeiMZe' // 2.4.5-forge+1.20.1
def foliageDependency = 'maven.modrinth:mc2-interactive-foliage:M4DdktEm' // 2.2.0-forge+1.20.1
def oculusDependency = 'maven.modrinth:oculus:iQ1SwGc3' // 1.20.1-1.8.0

// Bytecode guards must inspect the original published classes, before FG remaps them.
configurations {
    compatibilityArtifacts {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(swayDependency)
    implementation fg.deobf(foliageDependency)
    implementation fg.deobf(oculusDependency)
    // Oculus requires Embeddium in the development runtime; Modrinth POMs omit this dependency.
    runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1') // 0.3.31+mc1.20.1
    // Reserve Mixin's generated Args package in Forge's game module layer (Mixin issue #494).
    runtimeOnly fg.deobf('curse.maven:mixin-args-1257105:6488404') // Mixin Args 1.0, Java 17
    implementation fg.deobf('maven.modrinth:endinglibrary:KwxldfZc')
    implementation fg.deobf('maven.modrinth:geckolib:LwI6czff') // Forge 1.20.1, GeckoLib 4.7
    compatibilityArtifacts swayDependency
    compatibilityArtifacts foliageDependency
    compatibilityArtifacts oculusDependency
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
def originalModJar = { String module ->
    configurations.compatibilityArtifacts.resolvedConfiguration.resolvedArtifacts.find {
        it.moduleVersion.id.name == module
    }.file
}

tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version_range: minecraft_version_range,
                 forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                 mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

// Fail before copying resources if editing the eel engine stretches or compresses its texels.
tasks.register('verifyElectricEelUv') {
    group = 'verification'
    description = 'Checks every eel-engine face against its fixed, isotropic texture density; no packaging.'
    def modelFile = file("src/main/resources/assets/${mod_id}/models/block/electric_eel_engine.json")
    inputs.file(modelFile)
    inputs.files(fileTree("src/main/resources/assets/${mod_id}/textures/block") { include 'electric_eel_engine*.png' })
    doLast {
        def model = new groovy.json.JsonSlurper().parse(modelFile, 'UTF-8')
        def textures = [:]
        int checked = 0
        model.elements.each { element ->
            def size = (0..2).collect { (element.to[it] as double) - (element.from[it] as double) }
            def axes = [north: [0, 1], south: [0, 1], east: [2, 1], west: [2, 1], up: [0, 2], down: [0, 2]]
            if (element.rotation?.rescale) throw new GradleException("Eel UV: ${element.name} uses rescale; recheck physical texel density.")
            element.faces.each { direction, face ->
                String label = "${element.name}/${direction}"
                String reference = face.texture?.startsWith('#') ? model.textures[face.texture.substring(1)] : null
                if (!reference?.startsWith("${mod_id}:block/electric_eel_engine") || face.uv?.size() != 4 || !axes.containsKey(direction)) {
                    throw new GradleException("Eel UV: invalid texture or UV mapping at ${label}")
                }
                if (!textures.containsKey(reference)) {
                    def textureFile = file("src/main/resources/assets/${mod_id}/textures/${reference.split(':', 2)[1]}.png")
                    def image = javax.imageio.ImageIO.read(textureFile)
                    if (image == null) throw new GradleException("Eel UV: cannot decode ${textureFile}")
                    textures[reference] = [image.width, image.height]
                }
                def textureSize = textures[reference]
                def uvSpan = [Math.abs((face.uv[2] as double) - (face.uv[0] as double)),
                              Math.abs((face.uv[3] as double) - (face.uv[1] as double))]
                def pixels = (0..1).collect { uvSpan[it] * textureSize[it] / 16.0D }
                if ((face.rotation ?: 0) % 180 != 0) pixels = pixels.reverse()
                (0..1).each { axis ->
                    double extent = size[axes[direction][axis]]
                    double density = pixels[axis] / extent
                    if (extent <= 0 || !Double.isFinite(density) || Math.abs(density - 8.0D) > 0.00001D) {
                        throw new GradleException("Eel UV: ${label}, axis ${axis}: ${density} px/unit; expected 8. Redraw or crop the UV island instead of stretching it.")
                    }
                }
                if (face.uv.any { (it as double) < 0 || (it as double) > 16 }) throw new GradleException("Eel UV: out-of-atlas mapping at ${label}")
                checked++
            }
        }
        if (checked == 0) throw new GradleException('Eel UV: model has no faces to check')
        logger.lifecycle("Eel UV: ${checked} faces passed, 8 px/model unit on both axes.")
    }
}
tasks.named('processResources') { dependsOn 'verifyElectricEelUv' }

tasks.named('jar', Jar).configure {
    manifest { attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}.blackhole.mixins.json,${mod_id}.finale.mixins.json,${mod_id}.illusiontp.mixins.json,${mod_id}.colorloss.mixins.json,${mod_id}.worldwarp.mixins.json", 'Implementation-Version': mod_version) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// These tasks verify contracts and delegation without starting Minecraft.
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('verifyCompatibility', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.ContractVerification'
    inputs.files(configurations.compatibilityArtifacts)
    doFirst { args originalModJar('sway').absolutePath, originalModJar('mc2-interactive-foliage').absolutePath, layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath }
}
tasks.register('verifyDelegation', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.DelegationVerification'
}
tasks.named('check') { dependsOn 'verifyCompatibility', 'verifyDelegation' }

tasks.register('verifyArtifact', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('reobfJar'), tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.ArtifactVerification'
    args tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath, mod_version
}
tasks.named('check') { dependsOn 'verifyArtifact' }

// Regression for the ModLauncher bytecode-provider rejection observed in 1.0.0's runtime log.
tasks.register('verifyGuard', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.GuardVerification'
    // Match the launcher's access needed by SecureJar's union filesystem in this headless test only.
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    inputs.files(configurations.compatibilityArtifacts)
    doFirst { args originalModJar('sway').absolutePath, layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath }
}
tasks.named('check') { dependsOn 'verifyGuard' }

tasks.register('verifyBlackHole', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.BlackHoleVerification'
}
tasks.named('check') { dependsOn 'verifyBlackHole' }

// Explicit, headless shelf checks. Do not attach to check, which also packages the mod.
tasks.register('verifyShelves', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.shelf.ShelfVerification'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    doFirst {
        def output = file(providers.gradleProperty('shelfVerificationDir').getOrElse("build/verification/shelves-${System.currentTimeMillis()}"))
        output.mkdirs()
        workingDir output
    }
}
tasks.register('verifyBlackHoleContracts', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.BlackHoleContractVerification'
    inputs.files(configurations.compatibilityArtifacts)
    doFirst { args originalModJar('oculus').absolutePath, layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath }
}
tasks.named('check') { dependsOn 'verifyBlackHoleContracts' }

dependencies {
    verificationRuntimeOnly 'org.lwjgl:lwjgl:3.3.1:natives-windows'
    verificationRuntimeOnly 'org.lwjgl:lwjgl-glfw:3.3.1:natives-windows'
    verificationRuntimeOnly 'org.lwjgl:lwjgl-opengl:3.3.1:natives-windows'
}
tasks.register('verifyBlackHoleGpu', JavaExec) {
    group = 'verification'
    description = 'Compiles production GLSL and tests synthetic occlusion in a hidden GLFW context; does not launch Minecraft.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.BlackHoleGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/blackhole-1.1.0/gpu').absolutePath
}

tasks.register('verifyBlackHoleLens', JavaExec) {
    group = 'verification'
    description = 'Checks near-camera screen-space lens boundaries and foreground rejection without launching Minecraft.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.BlackHoleLensVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/near-camera-2026-10-26/gpu').absolutePath
}

// Explicit high-quality checks; deliberately not attached to check or packaging.
tasks.register('verifyRelativisticGpu', JavaExec) {
    group = 'verification'
    description = 'Checks high-quality geodesics against analytic anchors and a supplied shader snapshot in a hidden GL context.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.RelativisticGpuVerification'
    doFirst {
        def baseline = providers.gradleProperty('blackHoleBaselineShaders')
        if (!baseline.isPresent() || !file(baseline.get() + '/field.glsl').isFile()) {
            throw new GradleException('Pass -PblackHoleBaselineShaders=<before-snapshot shader directory>')
        }
        def output = file(providers.gradleProperty('blackHoleVerificationDir').getOrElse("build/verification/high-${System.currentTimeMillis()}"))
        if (output.exists()) throw new GradleException("Use a new verification directory to preserve evidence: ${output}")
        output.mkdirs()
        workingDir output
        args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
             file(baseline.get()).absolutePath, output.absolutePath
    }
}

// Explicit hidden-GPU regression; never starts Minecraft.
tasks.register('verifyBlackHoleEnvironment', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.BlackHoleEnvironmentVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/lens-layers-2026-10-26/environment').absolutePath
}

// Explicit finale checks: intentionally independent of jar/reobfJar/check.
tasks.register('verifySingularityGlareGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.SingularityGlareGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/singularity-distance-glare-2026-10-27/gpu').absolutePath,
         file('audit/singularity-distance-glare-2026-10-27/before/src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath
}
tasks.register('verifyShockwaveGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.ShockwaveGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/shockwave-2026-10-27/gpu').absolutePath,
         file('audit/shockwave-2026-10-27/before/src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath
    if (project.hasProperty('shockwavePreviewEncoder')) args project.property('shockwavePreviewEncoder')
}
tasks.register('verifyFinaleChoreography', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.finale.FinaleChoreographyVerification'
}
tasks.register('verifyFinaleReimaginedGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.FinaleReimaginedGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/finale-reimagined-2026-10-27/gpu').absolutePath,
         file('audit/finale-reimagined-2026-10-27/before/src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('run/shaderpacks/ComplementaryUnbound_r5.9.3.zip').absolutePath
    if (project.hasProperty('finalePreviewEncoder')) args project.property('finalePreviewEncoder')
}
tasks.register('verifyFinale', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.FinaleVerification'
}
tasks.register('verifyFinaleGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.FinaleGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/finale-2026-10-26/gpu').absolutePath
}

tasks.register('verifyFinaleRecovery', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.finale.FinaleRecoveryVerification'
}

// Source switching, actual selected-pack GLSL, and singularity membrane regression; no packaging.
tasks.register('verifySingularityGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.SingularityGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/singularity-bubbles-2026-10-26/gpu').absolutePath,
         file('run/shaderpacks/ComplementaryUnbound_r5.9.3.zip').absolutePath
}

tasks.register('verifyFinaleFlashGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.FinaleFlashGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/finale-flash-2026-10-26/gpu').absolutePath
}

// Explicit checks; neither task produces a distributable JAR.
tasks.register('verifyFinaleFeedback', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.FinaleFeedbackVerification'
}
tasks.register('verifyFinaleFeedbackGpu', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath + configurations.verificationRuntimeClasspath
    mainClass = 'com.mega.overheaven.foliagecompat.blackhole.client.FinaleFeedbackGpuVerification'
    args file('src/main/resources/assets/overheaven_foliage_compat/shaders/blackhole').absolutePath,
         file('audit/wave-feedback-sky-2026-10-28/gpu').absolutePath
}
